<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý người dùng - BookStore</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background-color: #f0f2f5; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        h2 { color: #1a73e8; margin: 0; }
        button { padding: 10px 20px; background-color: #1a73e8; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.3s; }
        button:hover { background-color: #1557b0; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; color: #555; text-transform: uppercase; letter-spacing: 0.5px; }
        tr:hover { background-color: #f1f7ff; }
        
        .avatar { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; background: #eee; }
        .badge { padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .badge-active { background-color: #e6ffed; color: #28a745; }
        .badge-inactive { background-color: #ffeef0; color: #d73a49; }
        .role-admin { color: #f44336; font-weight: bold; }
        
        #loading { text-align: center; color: #666; font-style: italic; margin: 20px 0; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Danh sách người dùng</h2>
        <button onclick="fetchAllUsers()">Làm mới dữ liệu</button>
    </div>

    <div id="loading" style="display: none;">Đang lấy dữ liệu từ server...</div>

    <table id="userTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Ảnh</th>
                <th>Tên đăng nhập</th>
                <th>Email</th>
                <th>Họ tên</th>
                <th>Vai trò</th>
                <th>Trạng thái</th>
               
            </tr>
        </thead>
        <tbody id="userData">
            <!-- Dữ liệu API sẽ hiển thị ở đây -->
        </tbody>
    </table>
</div>

<script>
    // Hàm lấy tất cả người dùng
    async function fetchAllUsers() {
        const tbody = document.getElementById('userData');
        const loading = document.getElementById('loading');
        
        // Hiện trạng thái loading
        tbody.innerHTML = '';
        loading.style.display = 'block';

        try {
            // Gọi đến API của bạn
            const response = await axios.get('https://bookking000.vercel.app/api/users/');
            
            // Giả sử API trả về mảng trực tiếp hoặc nằm trong response.data.data
            const users = response.data.data || response.data;

            if (users && users.length > 0) {
                users.forEach(user => {
                    const statusBadge = user.is_active == 1 
                        ? '<span class="badge badge-active">Hoạt động</span>' 
                        : '<span class="badge badge-inactive">Khóa</span>';
                    
                    const roleClass = user.role === 'admin' ? 'role-admin' : '';
                    const avatarUrl = user.avatar || 'https://via.placeholder.com/35';

                    const row = `
                        <tr>
                            <td><strong>${user.id}</strong></td>
                            <td><img src="${avatarUrl}" class="avatar" alt="avatar"></td>
                            <td>${user.username}</td>
                            <td>${user.email}</td>
                            <td>${user.full_name || '---'}</td>
                            <td class="${roleClass}">${user.role}</td>
                            <td>${statusBadge}</td>
                           
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            } else {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;">Không có dữ liệu người dùng.</td></tr>';
            }
        } catch (error) {
            console.error("Lỗi API:", error);
            tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; color:red;">Lỗi: ${error.message}. Kiểm tra CORS tại Backend!</td></tr>`;
        } finally {
            loading.style.display = 'none';
        }
    }

    // Tự động tải dữ liệu khi vừa mở trang
    window.onload = fetchAllUsers;
</script>

</body>
</html>
